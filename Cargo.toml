[workspace]
resolver = "2"
members = [
    "crates/poom-types",
    "crates/poom-protocol",
    "crates/poom-transport",
    "crates/poom-storage",
    "crates/poom-daemon",
    "crates/poom-py",
    "crates/poom-ui",
    "crates/poom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Poom Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/poom-rs/poom"

[workspace.dependencies]
uuid = { version = "1.10", features = ["v7", "serde"] }
postcard = { version = "1.0", features = ["use-std", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol_str = { version = "0.2", features = ["serde"] }
bytes = "1.7"
thiserror = "1.0"
libc = "0.2"
redb = "2.1"
tiktoken-rs = "0.6"
crossbeam-channel = "0.5"
pyo3 = { version = "0.22", features = ["abi3-py39"] }
tokio = { version = "1.40", features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "time", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
